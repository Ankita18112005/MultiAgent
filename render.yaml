services:
  - type: web
    name: multiagent-research
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers=2 --threads=4 --worker-class=gthread --timeout=120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
